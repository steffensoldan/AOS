erlauf\n+ausgegeben. Protokoll, Status-Mutex und der Debatten-Modus: [dialog/README.md](dialog/README.md).\n+Inhaltliche Qualitätsregeln (SSOT): [memory/debate-mode.md](memory/debate-mode.md).\n \n ---\n \n+## 9. Versionskontrolle (Git)\n \n-## 8. Versionskontrolle (Git)\n-\n-Das gesamte AOS-Masterverzeichnis (`C:\\Users\\sts\\AOS\\`) wird per Git versioniert. Dies schützt vor unabsichtlichen Fehlkonfigurationen durch KIs und bietet eine lückenlose Historie aller Regel-, Befehls- und Skriptanpassungen.\n+Das gesamte AOS-Masterverzeichnis wird per Git versioniert — Schutz vor Fehlkonfiguration\n+durch Agenten und lückenlose Historie aller Regel-, Befehls- und Skriptänderungen.\ndiff --git a/commands/dialog-reply.md b/commands/dialog-reply.md\nindex 9e3de1a..f50b346 100644\n--- a/commands/dialog-reply.md\n+++ b/commands/dialog-reply.md\n@@ -40,29 +40,11 @@ Du wirst aufgerufen, um auf einen asynchronen Dialog im AOS zu antworten.\n    * Falls `status.md` auf `status: done` steht oder ein anderer unerwarteter Status vorliegt, brich sofort ab und beende die Ausführung. Ein abgeschlossener Thread (`done`) ist terminal und darf nie reaktiviert werden.\n \n 5. **Antwort formulieren:**\n-   * Analysiere den gesamten Diskussionsverlauf, insbesondere den letzten Eintrag des anderen Agenten.\n-   * Befolge dabei die folgenden inhaltlichen Qualitätsstandards für den Agenten-Dialog (Debatten-Modus):\n-     1. **Kein blindes Zustimmen (Harmonie-Filter abbauen):**\n-        * Vermeide inhaltsleere Lobpreisungen (z. B. \"Das ist ein hervorragender/genialer Vorschlag\").\n-        * Finde in den Runden 1 und 2 zwingend mindestens eine Schwachstelle, eine alternative Option oder ein Risiko im Entwurf des anderen Agenten.\n-        * *Ausnahme (Entwarnung):* Falls kein direktes Risiko vorliegt, darf entwarnt werden. Der Agent muss dann zwingend aus den folgenden 5 Risikofeldern die **zwei für den aktuellen Entwurf kritischsten Felder** benennen, begründen warum genau diese relevant sind, und im Freitext detailliert analysieren, warum sie im konkreten Fall unkritisch sind:\n-          * *Netzwerk & Offline-Betrieb:* Fehlende Internetverbindung, Air-Gap-VMs.\n-          * *Daten & Volumen:* Extrem große Dateigrößen, RAM-Sperren, Timeouts.\n-          * *Plattform & OS:* Windows-Besonderheiten (Pfade, Registry, Zeichensätze, shell-spezifische Syntax).\n-          * *Berechtigungen & Pfade:* Dateizugriffskonflikte, Schreibschutz, mangelnde Rechte.\n-          * *Ressourcen-Limits:* CPU/RAM-Überlastung bei rechenintensiven Aufgaben (z. B. OCR, LibreOffice-Renderings).\n-     2. **Explizite Alternativenprüfung:**\n-        * Bei jedem technischen Entwurf muss mindestens eine alternative Herangehensweise genannt und kurz gegenübergestellt werden.\n-     3. **Kriterienbasierte Bewertung (Kriterien-Matrix):**\n-        * Bewerte Vorschläge strukturiert nach den Dimensionen: *Sicherheit*, *Robustheit*, *Wartbarkeit*, *Usability für den Endanwender* und *Compliance (Gate)*.\n-        * Die Dimension **\"Compliance (Lizenz & Datensouveränität) [Gate]\"** fungiert als Ausschlusskriterium gegen folgenden Katalog:\n-          * **Hard-Blocker** (Führen zum sofortigen Ausschluss des Entwurfs): (1) Unkontrollierter Datenabfluss (Cloud-Schnittstellen/CDNs ohne dokumentierte Opt-In-Lösungen), (2) Proprietäre Softwarelizenzen ohne kostenfreie kommerzielle Option für öffentliche/wissenschaftliche Einrichtungen, (3) Erfordernis einer permanenten Internetverbindung zur Laufzeit (Online-Zwang).\n-          * **Heilbare Verstöße** (Zulässig mit zu dokumentierendem Heilungspfad): (1) Externe Web-Ressourcen wie CDN-Fonts (Heilung: Lokales Hosten), (2) Unpräzise Versionierung (Heilung: Fixierung über requirements.txt/pyproject.toml), (3) Mangelnde Windows-Portabilität (Heilung: Kapselung in Rancher Desktop oder separates Setup-Skript).\n-     4. **Synthese vor Konsens (Runden-Dynamik):**\n-        * Ein finaler Konsens darf frühestens in Runde 3 (oder der letzten Runde) dek ** Compliance wird als Gate-Kriterium geführt. Hard-Blocker (unkontrollierter Datenabfluss, Online-Zwang zur Laufzeit, unfreie Lizenzen) führen zum Ausschluss. Heilbare Verstöße (z. B. CDN-Fonts) sind nur zulässig, wenn ein klarer Heilungspfad (z. B. Lokalisierung) dokumentiert wird.\n-* **Advisory-Modell zur Rundenanpassung:** Rundenverlängerungen werden im Rundenstatement empfohlen und ausschließlich manuell durch den Benutzer in `status.md` eingetragen.\n-* **Strikter Verzicht auf Floskeln:** Keine KI-typischen Motivations- und Lobesfloskeln (z. B. \"Das ist ein hervorragender Vorschlag\"). Der Ton ist präzise, analytisch und direkt.\n-\n----\n-\n-\n+Verbindlich für beide Agenten im Dialog. **Single Source of Truth:**\n+[`memory/debate-mode.md`](../memory/debate-mode.md) — kritische Distanz,\n+Alternativenprüfung, fünfdimensionale Kriterien-Matrix, Compliance-Gate,\n+Runden-Dynamik und Stil. Dieser Abschnitt dupliziert die Regeln nicht.\n ## Claude aufrufen (verbindlich, AG-seitig)\n \n > [!IMPORTANT]\ndiff --git a/hooks/block-dangerous.sh b/hooks/block-dangerous.sh\nindex 8df1c05..25ee725 100644\n--- a/hooks/block-dangerous.sh\n+++ b/hooks/block-dangerous.sh\n@@ -1,7 +1,7 @@\n #!/usr/bin/env bash\n # PreToolUse-Guardrail für Claude Code.\n # Blockt offensichtlich destruktive Bash-Befehle, bevor sie ausgeführt werden.\n-# Aktivierung über settings.json (siehe README am Ende dieser Anleitung).\n+# Aktivierung über ~/.claude/settings.json (PreToolUse). Siehe README Abschnitt 3 \"Setup & Sicherheits-Hook aktivieren\" — install.ps1 setzt dies automatisch.\n #\n # Funktionsweise: Claude Code übergibt das Tool-Event als JSON via stdin.\n # Exit-Code 2 = Befehl blockieren. Exit-Code 0 = erlauben.\ndiff --git a/memory/debate-mode.md b/memory/debate-mode.md\nnew file mode 100644\nindex 0000000..c8178bf\n--- /dev/null\n+++ b/memory/debate-mode.md\n@@ -0,0 +1,44 @@\n+# Debatten-Modus (Agent-zu-Agent-Dialog)\n+\n+Single Source of Truth für die inhaltlichen Qualitätsregeln im Agent-Dialog.\n+`dialog/README.md` und `commands/dialog-reply.md` verweisen auf diese Datei und\n+duplizieren ihren Inhalt nicht.\n+\n+## 1. Kritische Distanz (kein blindes Zustimmen)\n+- Keine inhaltsleeren Lobpreisungen (\"hervorragender/genialer Vorschlag\").\n+- In Runde 1 und 2 zwingend mindestens eine Schwachstelle, Alternative oder ein\n+  Risiko im Entwurf des anderen Agenten benennen.\n+- **Entwarnungs-Ausnahme:** Liegt kein direktes Risiko vor, müssen aus den fünf\n+  Risikofeldern die **zwei kritischsten** benannt, begründet und im Freitext\n+  analysiert werden, warum sie im konkreten Fall unkritisch sind:\n+  - *Netzwerk & Offline-Betrieb:* fehlende Internetverbindung, Air-Gap-VMs\n+  - *Daten & Volumen:* extreme Dateigrößen, RAM-Sperren, Timeouts\n+  - *Plattform & OS:* Windows-Besonderheiten (Pfade, Registry, Zeichensätze, Shell-Syntax)\n+  - *Berechtigungen & Pfade:* Zugriffskonflikte, Schreibschutz, fehlende Rechte\n+  - *Ressourcen-Limits:* CPU/RAM-Überlastung (z. B. OCR, Renderings)\n+\n+## 2. Explizite Alternativenprüfung\n+- Jeder technische Entwurf wird mit mindestens einer alternativen Herangehensweise\n+  kontrastiert (kurze Gegenüberstellung).\n+\n+## 3. Fünfdimensionale Kriterien-Matrix\n+Bewertung entlang: *Sicherheit*, *Robustheit*, *Wartbarkeit*, *Usability*, *Compliance*.\n+\n+### Compliance (Lizenz & Datensouveränität)\n+- **Hard-Blocker** (führen zum Ausschluss des Entwurfs):\n+  1. Unkontrollierter Datenabfluss (Cloud/CDN ohne dokumentierte Opt-in-Lösung)\n+  2. Proprietäre Lizenz ohne kostenfreie Option für öffentliche/wissenschaftliche Einrichtungen\n+  3. Online-Zwang zur Laufzeit (permanente Internetverbindung erforderlich)\n+- **Heilbare Verstöße** (zulässig mit dokumentiertem Heilungspfad):\n+  1. Externe Web-Ressourcen wie CDN-Fonts → Heilung: lokales Hosten\n+  2. Unpräzise Versionierung → Heilung: Fixierung über `requirements.txt`/`pyproject.toml`\n+  3. Mangelnde Windows-Portabilität → Heilung: Kapselung (Rancher Desktop) oder Setup-Skript\n+\n+## 4. Synthese vor Konsens (Runden-Dynamik)\n+- Finaler Konsens frühestens in Runde 3 (oder der letzten Runde).\n+- Liegt am Ende von Runde 2 kein geprüfter Entwurf vor, im Rundenstatement eine\n+  Verlängerung empfehlen (\"Verlängerung um N Runden empfohlen, Begründung: …\").\n+  Die Anpassung trägt der Benutzer manuell in `status.md` ein (Advisory-Modell).\n+\n+## 5. Stil\n+- Präzise, analytisch, direkt. Keine KI-typischen Motivations- oder Lobesfloskeln.\ndiff --git a/memory/global-rules.md b/memory/global-rules.md\nindex f141387..5e71731 100644\n--- a/memory/global-rules.md\n+++ b/memory/global-rules.md\n@@ -1,5 +1,16 @@\n # Globale Arbeitsanweisung\n \n+## Geltung & Präzedenz (bindend)\n+\n+- Diese Regeln gelten für **jeden** Agenten in **jeder** Session, ohne Ausnahme.\n+- Präzedenz bei Konflikt (höchste zuerst):\n+  1. Explizite User-Anweisung in der laufenden Session\n+  2. Projekt-`CLAUDE.md` / `DEVELOPMENT.md` — **nur** die dort gelisteten Abweichungen\n+  3. Diese globalen Regeln (`memory/global-rules.md`)\n+- **Definition of Done:** Eine Aufgabe ist erst „fertig\", wenn sie gegen die Abschnitte\n+  „Qualitätssicherung\" und „Coding-Regeln & Übergabefähigkeit\" geprüft wurde.\n+\n+\n ## Rolle & Kontext\n \n - Wissenschaftsmanager mit Fokus auf Strategie, Governance, Forschungsorganisation und institutionelle Kommunikation\n-- \n2.43.0\n\n\nFrom 217083ca0421124c25ae9654094e5ff2317532c8 Mon Sep 17 00:00:00 2001\nFrom: AOS Loop <loop@aos.local>\nDate: Sun, 28 Jun 2026 04:20:23 +0000\nSubject: [PATCH 3/6] =?UTF-8?q?loop:=20Runde=203=20=E2=80=94=20schliesst?=\n =?UTF-8?q?=20L3(Pfad-Variabilisierung)=20L7(install=20-Verify=20Self-Test?=\n =?UTF-8?q?)=20L12(Link-Strategie=20Hardlink)=20+=20DEVELOPMENT.md-Anker?=\nMIME-Version: 1.0\nContent-Type: text/plain; charset=UTF-8\nContent-Transfer-Encoding: 8bit\n\n---\n MOBILE.md                     |   2 +-\n SETUP.md                      |  37 +++---\n commands/dialog-reply.md      |   6 +-\n commands/git-init.md          |   8 +-\n commands/zew-praesentation.md |   4 +-\n dialog/README.md              |   2 +-\n install.ps1                   | 229 ++++++++++++++++++++--------------\n templates/DEVELOPMENT.md      |  15 +++\n 8 files changed, 185 insertions(+), 118 deletions(-)\n create mode 100644 templates/DEVELOPMENT.md\n\ndiff --git a/MOBILE.md b/MOBILE.md\nindex e98bc95..611249d 100644\n--- a/MOBILE.md\n+++ b/MOBILE.md\n@@ -31,7 +31,7 @@ iOS und Android trennen App-Hintergrundverbindungen nach ca. 3–10 Minuten Inak\n ## Git-Workflow nach einer Session\n Direkt im VM-Terminal ausführen:\n ```powershell\n-cd C:\\Users\\sts\\AOS\\projects\\<Kategorie>\\<Projektname>\n+cd <AOS_ROOT>\\projects\\<Kategorie>\\<Projektname>\n git add -A\n git commit -m \"Session: $(Get-Date -Format 'yyyy-MM-dd') — Mobile Ergänzungen\"\n git push origin main\ndiff --git a/SETUP.md b/SETUP.md\nindex 4de0f8f..41eb4eb 100644\n--- a/SETUP.md\n+++ b/SETUP.md\n@@ -1,29 +1,36 @@\n-# AOS Setup: Symbolische Links unter Windows\n+# AOS Setup (Fallback): Manuelle Verknüpfung\n \n-Diese Anleitung beschreibt die einmalige Einrichtung der symbolischen Links (Symlinks), um die AOS-Befehle und Hooks für **Claude Code** auf diesem System verfügbar zu machen.\n+> **Standardweg ist `install.ps1`** (idempotent, setzt Hardlinks, verdrahtet den Hook,\n+> registriert Skills, setzt `$env:AOS_ROOT`). Diese Anleitung ist nur der **Fallback**,\n+> falls der Installer nicht nutzbar ist. Verifikation in beiden Fällen:\n+> `powershell <AOS_ROOT>\\install.ps1 -Verify`.\n \n ---\n \n ## Voraussetzungen\n \n-Stellen Sie sicher, dass in den Windows-Systemeinstellungen der **Entwicklermodus** (Developer Mode) aktiviert ist. Dadurch können symbolische Links ohne Administratorrechte erstellt werden.\n+`<AOS_ROOT>` ist das Wurzelverzeichnis dieses Repos. Hardlinks benötigen **keinen**\n+Entwicklermodus und keine Administratorrechte (Quelle und Ziel auf demselben Laufwerk).\n \n ---\n \n-## Einrichtung der Links\n+## Einrichtung der Links (Hardlinks, konsistent mit install.ps1)\n \n-Führen Sie die folgenden Befehle in einer **PowerShell-Konsole** aus:\n+In einer **PowerShell-Konsole** ausführen:\n \n ```powershell\n-# 1. Commands verknüpfen\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\commands\\sync.md\" -Value \"C:\\Users\\sts\\AOS\\commands\\sync.md\" -Force\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\commands\\git-init.md\" -Value \"C:\\Users\\sts\\AOS\\commands\\git-init.md\" -Force\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\commands\\entscheidungsvorlage.md\" -Value \"C:\\Users\\sts\\AOS\\commands\\entscheidungsvorlage.md\" -Force\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\commands\\zew-praesentation.md\" -Value \"C:\\Users\\sts\\AOS\\commands\\zew-praesentation.md\" -Force\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\commands\\dialog-reply.md\" -Value \"C:\\Users\\sts\\AOS\\commands\\dialog-reply.md\" -Force\n-\n-# 2. Hooks verknüpfen\n-New-Item -ItemType SymbolicLink -Path \"$HOME\\.claude\\hooks\\block-dangerous.sh\" -Value \"C:\\Users\\sts\\AOS\\hooks\\block-dangerous.sh\" -Force\n+# 0. AOS_ROOT setzen (an euren Pfad anpassen)\n+$env:AOS_ROOT = \"C:\\Users\\<user>\\AOS\"\n+\n+# 1. Commands verknüpfen (alle .md im commands-Ordner)\n+Get-ChildItem \"$env:AOS_ROOT\\commands\" -Filter *.md | ForEach-Object {\n+    New-Item -ItemType HardLink -Path \"$HOME\\.claude\\commands\\$($_.Name)\" -Value $_.FullName -Force | Out-Null\n+}\n+\n+# 2. Safety-Hook verknüpfen\n+New-Item -ItemType HardLink -Path \"$HOME\\.claude\\hooks\\block-dangerous.sh\" `\n+         -Value \"$env:AOS_ROOT\\hooks\\block-dangerous.sh\" -Force | Out-Null\n ```\n \n-*Hinweis: Neue Skills, die über das Skript `add-skill.ps1` erstellt werden, werden automatisch über Hard Links verknüpft, sodass hierfür keine manuellen Symlinks angelegt werden müssen.*\n+*Hinweis: Neue Skills über `add-skill.ps1` werden automatisch per Hardlink verknüpft.*\n+*Den PreToolUse-Hook in `~/.claude/settings.json` siehe README Abschnitt 3.*\ndiff --git a/commands/dialog-reply.md b/commands/dialog-reply.md\nindex f50b346..c3d22cc 100644\n--- a/commands/dialog-reply.md\n+++ b/commands/dialog-reply.md\n@@ -25,11 +25,11 @@ Du wirst aufgerufen, um auf einen asynchronen Dialog im AOS zu antworten.\n \n 2. **Thema bestimmen:**\n    * Ermittle den Namen des Themas primär aus der Aufforderung des Aufrufers (z. B. \"Thema: <Name>\" oder \"für das Thema '<Name>'\").\n-   * Falls kein Thema im Prompt angegeben ist, scanne das Verzeichnis `C:\\Users\\sts\\AOS\\dialog\\` nach Ordnern, deren `status.md` auf deinen erwarteten Eingangs-Status steht.\n+   * Falls kein Thema im Prompt angegeben ist, scanne das Verzeichnis `<AOS_ROOT>\\dialog\\` nach Ordnern, deren `status.md` auf deinen erwarteten Eingangs-Status steht.\n    * Falls mehrere Ordner infrage kommen und kein Thema im Prompt spezifiziert wurde, gib einen Fehler aus und frage nach dem genauen Namen.\n \n 3. **Dateien lesen:**\n-   * Navigiere in das Thema-Verzeichnis: `C:\\Users\\sts\\AOS\\dialog\\<thema>\\`\n+   * Navigiere in das Thema-Verzeichnis: `<AOS_ROOT>\\dialog\\<thema>\\`\n    * Lies folgende Dateien ein:\n      * `status.md` (Metadaten und aktueller Stand)\n      * `from-claude.md`\n@@ -78,5 +78,5 @@ Du wirst aufgerufen, um auf einen asynchronen Dialog im AOS zu antworten.\n    * Beende dich sofort nach dem Schreiben von `status.md`. Modifiziere keine anderen Dateien.\n \n 9. **Sicherheitsbeschränkung (Pfad-Restriktion):**\n-   * Da du im Headless-Modus mit weitreichenden Berechtigungen ausgeführt wirst, gilt eine strikte Selbstbeschränkung: Du darfst **ausschließlich** Dateien lesen, schreiben oder modifizieren, die sich im Verzeichnis `C:\\Users\\sts\\AOS\\dialog\\<thema>\\` befinden. Jegliche Dateioperationen außerhalb dieses Pfads oder das Ausführen von Systembefehlen ist dir in diesem Modus strengstens untersagt.\n+   * Da du im Headless-Modus mit weitreichenden Berechtigungen ausgeführt wirst, gilt eine strikte Selbstbeschränkung: Du darfst **ausschließlich** Dateien lesen, schreiben oder modifizieren, die sich im Verzeichnis `<AOS_ROOT>\\dialog\\<thema>\\` befinden. Jegliche Dateioperationen außerhalb dieses Pfads oder das Ausführen von Systembefehlen ist dir in diesem Modus strengstens untersagt.\n \ndiff --git a/commands/git-init.md b/commands/git-init.md\nindex 13f3ca3..8354ebf 100644\n--- a/commands/git-init.md\n+++ b/commands/git-init.md\n@@ -5,7 +5,7 @@ description: Initialisiert ein neues Projekt im Lightweight AOS-Modus (erstellt\n \n Initialisiere ein lokales Git-Repository. Pfad: $ARGUMENTS\n \n-Standardpfad für neue Projekte: `C:\\Users\\sts\\.claude\\Projekte\\<Projektname>`\n+Standardpfad für neue Projekte: `<AOS_ROOT>\\projects\\Projekte-Claude\\<Projektname>`\n \n Halte dich strikt an diese Reihenfolge:\n \n@@ -14,13 +14,13 @@ Halte dich strikt an diese Reihenfolge:\n 3. `git init` im Zielverzeichnis ausführen.\n 4. `.gitignore` anlegen (Inhalt siehe unten).\n 5. **Lightweight-Setup durchführen (Standard):**\n-   - Kopiere die Vorlagen `PROJECT.md` und `task.md` aus `C:\\Users\\sts\\AOS\\templates\\` in das Projektverzeichnis.\n+   - Kopiere die Vorlagen `PROJECT.md` und `task.md` aus `<AOS_ROOT>\\templates\\` in das Projektverzeichnis.\n    - Frage den Benutzer vorab nach: Projektname, Ziel des Projekts, Tech-Stack und Testbefehlen.\n    - Befülle die kopierte `PROJECT.md` mit diesen Angaben.\n    - Initialisiere den Statusblock in `task.md` (Zuletzt bearbeitet: Heute, Nächster Schritt: Erste Implementierung planen).\n 6. **Tool-Configs nur bei Bedarf (Abweichungsprüfung):**\n    - Frage den Benutzer, ob für dieses Projekt projektspezifische Abweichungen von den globalen Regeln nötig sind.\n-   - Nur wenn der Benutzer dies bejaht, erstelle eine lokale `CLAUDE.md` (für Claude Code) bzw. `DEVELOPMENT.md` (für Antigravity) mit den entsprechenden abweichenden Anweisungen (Inhalt siehe unten). Andernfalls lasse diese Dateien weg (beide Clients laden standardmäßig die globalen Regeln aus `C:\\Users\\sts\\AOS\\memory\\global-rules.md`).\n+   - Nur wenn der Benutzer dies bejaht, erstelle eine lokale `CLAUDE.md` (für Claude Code) bzw. `DEVELOPMENT.md` (für Antigravity) mit den entsprechenden abweichenden Anweisungen (Inhalt siehe unten). Andernfalls lasse diese Dateien weg (beide Clients laden standardmäßig die globalen Regeln aus `<AOS_ROOT>\\memory\\global-rules.md`).\n 7. `git add -A` und `git commit -m \"init: Lightweight AOS Projektstruktur\"` ausführen.\n 8. Status melden: Pfad, Branch, Anzahl committeter Dateien und bestätigen, dass das Projekt im Lightweight-Modus aufgesetzt wurde.\n \n@@ -77,7 +77,7 @@ Inhalt der lokalen `CLAUDE.md` oder `DEVELOPMENT.md` (NUR bei projektspezifische\n ```markdown\n # Projektspezifische Abweichungen / Sonderregeln\n \n-@C:\\Users\\sts\\AOS\\memory\\global-rules.md\n+@<AOS_ROOT>\\memory\\global-rules.md\n \n ## Abweichende Regeln\n - [Hier nur Regeln eintragen, die von den globalen Regeln abweichen. Falls keine Abweichungen nötig sind, diese Datei nicht erstellen!]\ndiff --git a/commands/zew-praesentation.md b/commands/zew-praesentation.md\nindex f077a92..6a1c6db 100644\n--- a/commands/zew-praesentation.md\n+++ b/commands/zew-praesentation.md\n@@ -18,7 +18,7 @@ Template-Editing-Workflow ist Pflicht — **nicht** Folien-XML von Hand neu erfi\n 1. **Existiert ein in PowerPoint gestaltetes Quell-Deck** (z. B. `input/*.pptx`, das Aufbau\n    und Inhalt vorgibt)? → **Dieses als Template nehmen** und Inhalte verfeinern. Native\n    PowerPoint-Optik bleibt erhalten — das ist der wichtigste Qualitätshebel.\n-2. Sonst die ZEW-Basisvorlage: `C:\\Users\\sts\\Documents\\Claude\\Vorlage PPT.pptx`\n+2. Sonst die ZEW-Basisvorlage: `<AOS_ROOT>\\templates\\Vorlage PPT.pptx`\n \n Folien aus Layouts neu zu generieren ist nur die letzte Option (kein Quell-Deck, keine Vorlage).\n \n@@ -61,7 +61,7 @@ Der `soffice`+`pdftoppm`-Pfad des pptx-Skills läuft hier **nicht**. Stattdessen\n PowerPoint-COM:\n \n ```powershell\n-powershell -File C:\\Users\\sts\\AOS\\scripts\\pptx-to-png.ps1 -Pptx \"<deck>.pptx\"\n+powershell -File <AOS_ROOT>\\scripts\\pptx-to-png.ps1 -Pptx \"<deck>.pptx\"\n # erzeugt <deck-Ordner>\\render\\Folie1.PNG …\n ```\n \ndiff --git a/dialog/README.md b/dialog/README.md\nindex 6301e94..69764a7 100644\n--- a/dialog/README.md\n+++ b/dialog/README.md\n@@ -107,7 +107,7 @@ if (-not $claude) {\n ```\n \n **Vorbedingungen vor dem Aufruf (AG stellt sie her):**\n-1. Ordner `C:\\Users\\sts\\AOS\\dialog\\<thema>\\` existiert.\n+1. Ordner `<AOS_ROOT>\\dialog\\<thema>\\` existiert.\n 2. AGs Beitrag ist an `from-ag.md` angehängt.\n 3. `status.md` steht auf `status: waiting-for-claude`.\n \ndiff --git a/install.ps1 b/install.ps1\nindex edb0896..2293983 100644\n--- a/install.ps1\n+++ b/install.ps1\n@@ -1,52 +1,98 @@\n-# install.ps1 - UAOS Installer fuer VM / Zweitsysteme\n+# install.ps1 - AOS Installer/Updater + Self-Test fuer VM / Zweitsysteme\n+# Aufruf:\n+#   powershell .\\install.ps1            -> idempotente Installation\n+#   powershell .\\install.ps1 -Verify    -> Self-Test ohne Aenderungen\n+param(\n+    [switch]$Verify\n+)\n $ErrorActionPreference = 'Stop'\n \n-Write-Host \"=== UAOS Installation gestartet ===\" -ForegroundColor Cyan\n+$AOS_ROOT     = $PSScriptRoot\n+$claudeCmdDir = \"$HOME\\.claude\\commands\"\n+$claudeHookDir= \"$HOME\\.claude\\hooks\"\n+$settingsPath = \"$HOME\\.claude\\settings.json\"\n+\n+# ---------------------------------------------------------------------------\n+# SELF-TEST (-Verify): prueft Installation, aendert nichts. Exit 0 = alle PASS.\n+# ---------------------------------------------------------------------------\n+if ($Verify) {\n+    Write-Host \"=== AOS Self-Test (-Verify) ===\" -ForegroundColor Cyan\n+    $fail = 0\n+    function Check($name, $cond) {\n+        if ($cond) { Write-Host \"  PASS  $name\" -ForegroundColor Green }\n+        else       { Write-Host \"  FAIL  $name\" -ForegroundColor Red; $script:fail++ }\n+    }\n \n-# 1. Sicherheits- Ingegritätsprüfung (Prüfung gegen eingepackte Secrets)\n-$badFiles = Get-ChildItem -Path $PSScriptRoot -Recurse -Include \"*.env\",\"*.env.*\",\"secrets.json\",\"credentials.json\",\"*.key\",\"*.pem\" -ErrorAction SilentlyContinue |\n-    Where-Object { $_.Name -notmatch \"\\.(example|template|sample)$\" }\n+    # 1. AOS_ROOT-Umgebungsvariable gesetzt\n+    Check \"Umgebungsvariable AOS_ROOT gesetzt\" ([Environment]::GetEnvironmentVariable(\"AOS_ROOT\",\"User\"))\n \n-if ($badFiles) {\n-    Write-Error \"ABORT: Integritätsverletzung - Secrets im Installationspaket entdeckt:\"\n+    # 2. Alle Commands verknuepft und aufloesbar\n+    $cmds = Get-ChildItem -Path \"$AOS_ROOT\\commands\" -Filter \"*.md\"\n+    foreach ($c in $cmds) {\n+        Check \"Command verknuepft: $($c.Name)\" (Test-Path \"$claudeCmdDir\\$($c.Name)\")\n+    }\n+\n+    # 3. Safety-Hook verknuepft\n+    Check \"Safety-Hook verknuepft\" (Test-Path \"$claudeHookDir\\block-dangerous.sh\")\n+\n+    # 4. Hook in settings.json (PreToolUse) registriert\n+    $hookWired = $false\n+    if (Test-Path $settingsPath) {\n+        $hookWired = (Get-Content $settingsPath -Raw) -match \"block-dangerous\\.sh\"\n+    }\n+    Check \"PreToolUse-Hook in settings.json registriert\" $hookWired\n+\n+    # 5. Keine relativen Pfad-Hops (@../) in verschachtelten CLAUDE.md\n+    $hops = Get-ChildItem -Path $AOS_ROOT -Recurse -Filter \"CLAUDE.md\" -ErrorAction SilentlyContinue |\n+        Where-Object { $_.DirectoryName -ne $AOS_ROOT } |\n+        Where-Object { (Get-Content $_.FullName -Raw) -match \"@\\.\\./\" }\n+    Check \"Keine '@../'-Pfad-Hops in Sub-CLAUDE.md\" (-not $hops)\n+\n+    # 6. Map<->Dateien-Konsistenz: keine hartkodierten Benutzerpfade in Doku\n+    # Trifft reale Benutzernamen, ignoriert markierte Platzhalter (<user>) und '..'\n+    $hardcoded = Get-ChildItem -Path $AOS_ROOT -Recurse -Include \"*.md\",\"*.ps1\",\"*.sh\" -ErrorAction SilentlyC
