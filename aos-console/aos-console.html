<style>

  --ground:#f5f5fc; --surface:#ffffff; --surface-2:#f4f3fb; --raise:#ffffff;
  --border:#e6e4f4; --border-strong:#cfcbe6;
  --ink:#1e1b33; --muted:#5f5b7d; --faint:#918da8;

  :root:not([data-theme="light"]){
    --ground:#141326; --surface:#1d1b36; --surface-2:#242142; --raise:#26234a;
    --border:#332f52; --border-strong:#443f66;
    --ink:#ece9fb; --muted:#a49fc4; --faint:#726d95;
    --accent:#8b78ff; --accent-ink:#141326; --accent-soft:#282350; --accent-line:#3d3670;
    --secondary:#ff7d6e; --secondary-soft:#3a2230;
    --ok:#3fc08a; --ok-soft:#153026; --warn:#e0a63a; --warn-soft:#2c2413; --bad:#e8635f; --bad-soft:#301a1e;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 10px 30px rgba(0,0,0,.42);
    --shadow-sheet:0 10px 46px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#141326; --surface:#1d1b36; --surface-2:#242142; --raise:#26234a;
  --border:#332f52; --border-strong:#443f66;
  --ink:#ece9fb; --muted:#a49fc4; --faint:#726d95;
  --accent:#8b78ff; --accent-ink:#141326; --accent-soft:#282350; --accent-line:#3d3670;
  --secondary:#ff7d6e; --secondary-soft:#3a2230;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--disp); margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---- layout shell ---- */
.wrap{max-width:1040px; margin:0 auto; padding:0 14px 96px}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1040px; margin:0 auto; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand .glyph{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--secondary));
  display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand h1{font-size:17px;font-weight:700;line-height:1}
.brand .sub{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}

.src{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:6px 8px 6px 11px;box-shadow:var(--shadow);
}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.src .lbl{font-size:12px;font-family:var(--mono);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.src button{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  font-size:11.5px;padding:5px 9px;border-radius:7px;white-space:nowrap;
}
.src button:hover{border-color:var(--accent-line)}
.icon-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-line)}

/* ---- section headers ---- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:600}
.sec-head .eyebrow{margin-left:auto}

/* ---- mental model band ---- */
.model{
  margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;box-shadow:var(--shadow);
}
.model .flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agent{
  font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--surface-2);display:flex;gap:7px;align-items:center;
}
.agent b{font-family:var(--disp);font-weight:600;font-size:12.5px}
.agent .tick{width:7px;height:7px;border-radius:2px}
.arrow{color:var(--faint);font-size:15px}
.bus{
  flex:1 1 180px;min-width:150px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  border:1px dashed var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--surface-2)
}
.model p{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.prec{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.prec span{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.prec .gt{color:var(--faint);align-self:center;border:0;background:none;padding:0 2px}

/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:3px;
}
.kpi.tap{cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.tap:hover{border-color:var(--accent-line)}
.kpi.tap::after{content:"›";position:absolute;top:9px;right:12px;color:var(--faint);font-family:var(--mono);font-size:14px}
.ohtab{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.ohtab th,.ohtab td{border:1px solid var(--border);padding:7px 10px}
.ohtab th{background:var(--surface-2);font-weight:600;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.ohtab td:first-child,.ohtab th:first-child{font-family:var(--mono);font-size:11.5px}
.ohtab tr.sum td{background:var(--accent-soft);font-weight:600;color:var(--accent);border-color:var(--accent-line)}
.ohbig{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin:12px 0}
.ohbig .k{font-weight:600;font-size:13px}
.ohbig .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.ohbig .v{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ohbig .v small{font-size:12px;color:var(--faint);font-weight:600}
.kpi .n{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:15px;color:var(--faint);font-weight:600}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .meta{font-size:10.5px;color:var(--faint);font-family:var(--mono)}

/* ---- structure map ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.node{
  text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;

.node h3{font-size:14.5px;font-weight:600}
.node .path{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:1px}
.node .desc{font-size:12.5px;color:var(--muted);line-height:1.45;flex:1}
.node .foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 9px}
.node .go{margin-left:auto;color:var(--accent);font-size:12px;font-weight:600;font-family:var(--mono)}

/* projects node accent */
.node.proj .badge{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%, transparent)}

/* ---- dialog list ---- */
.dlg-list{display:flex;flex-direction:column;gap:9px}
.dlg{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 13px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center
}
.dlg:hover{border-color:var(--accent-line)}
.dlg .body{flex:1;min-width:0}
.dlg .t{font-family:var(--mono);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .m{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill.done{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.pill.open{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%, transparent)}
.pill.wait{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.ready{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%, transparent)}
.pill.notready{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%, transparent)}

.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:10px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center
}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn small{font-weight:400;opacity:.8;font-size:11px}

/* ---- sheet / overlay ---- */
.scrim{position:fixed;inset:0;background:rgba(12,18,30,.5);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:50;background:var(--surface);box-shadow:var(--shadow-sheet);
  display:flex;flex-direction:column;
  left:0;right:0;bottom:0;top:8vh;border-radius:18px 18px 0 0;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.7,.2,1);
}
.sheet.on{transform:translateY(0)}

}
.sheet-head{

  position:sticky;top:0;background:var(--surface);z-index:2
}
.sheet-head .grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:38px;height:4px;border-radius:3px;background:var(--border-strong)}
@media(min-width:760px){.sheet-head .grab{display:none}}
.sheet-head h2{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .path{font-family:var(--mono);font-size:11px;color:var(--faint);display:block;font-weight:400}
.x{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:17px;line-height:1;flex:0 0 auto}
.x:hover{color:var(--bad);border-color:var(--bad)}
.sheet-body{overflow:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}

.crumb{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer}

.filerow{
  width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px
}
.filerow:hover{border-color:var(--accent-line)}
.filerow .fi{font-size:15px}
.filerow .fn{font-family:var(--mono);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .fs{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.filerow.edited .fn::after{content:" • bearbeitet";color:var(--warn);font-size:10px}

.viewer-tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--muted);padding:6px 12px;font-size:12px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.viewer-tools .spacer{flex:1}

.save[disabled]{opacity:.45;filter:grayscale(.3)}

.md{font-size:14px;line-height:1.62;word-wrap:break-word}
.md h1{font-size:20px;margin:2px 0 10px}
.md h2{font-size:16.5px;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.md h3{font-size:14.5px;margin:16px 0 6px}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0;padding-left:22px}
.md li{margin:4px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.md pre{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:11px 0}
.md pre code{background:none;border:0;padding:0;font-size:12px;line-height:1.5}
.md blockquote{margin:11px 0;padding:6px 14px;border-left:3px solid var(--accent-line);color:var(--muted);background:var(--surface-2);border-radius:0 8px 8px 0}
.md hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.md a{color:var(--accent)}
.md table{border-collapse:collapse;font-size:12.5px;margin:11px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md th{background:var(--surface-2);font-weight:600}
.raw{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto}
textarea.editor{
  width:100%;min-height:52vh;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:12px;resize:vertical
}
textarea.editor:focus{outline:2px solid var(--accent);outline-offset:1px}

.thread .msg{border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:var(--surface-2)}
.thread .msg.cc{border-left:3px solid var(--accent)}
.thread .msg.ag{border-left:3px solid var(--secondary)}
.thread .who{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}

.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:9px 12px;margin:12px 0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{
  font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;width:100%
}
.field textarea{font-family:var(--mono);font-size:12.5px;min-height:96px;resize:vertical}
.field .hint{font-size:11px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--ink);color:var(--ground);font-size:12.5px;font-family:var(--mono);
  padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-sheet);opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;max-width:90vw;text-align:center
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
